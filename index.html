<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12143A">
<title>Consulta de preços · Livraria Big</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#12143A;
  --tinta-2:#1C1F55;
  --tinta-3:#2A2E70;
  --papel:#FFFDF6;
  --marca:#FFD833;
  --texto:#EDEBFF;
  --texto-fraco:#A6A6D6;
  --erro:#FF7A5C;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --corpo:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--tinta);
  color:var(--texto);
  font-family:var(--corpo);
  -webkit-text-size-adjust:100%;
  min-height:100dvh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}

/* ---------- topo ---------- */
.topo{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.10);
  position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--tinta) 78%,rgba(18,20,58,.86));
  backdrop-filter:blur(6px);
}
.marca{
  font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.14em;
}
.marca em{font-style:normal;color:var(--marca)}
.sub{font-size:13px;color:var(--texto-fraco);letter-spacing:.02em}

main{padding:18px 18px 0;max-width:620px;margin:0 auto}

/* ---------- busca ---------- */
.busca{position:relative;margin:0 0 16px}
.busca input{
  width:100%;font-size:17px;font-family:var(--corpo);
  padding:15px 44px 15px 16px;
  background:var(--tinta-2);color:var(--texto);
  border:1px solid rgba(255,255,255,.14);border-radius:14px;
}
.busca input::placeholder{color:var(--texto-fraco)}
.busca input::-webkit-search-cancel-button,.busca input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.limpar{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--texto-fraco);font-size:22px;
  width:36px;height:36px;cursor:pointer;line-height:1;
}

/* ---------- resultado ---------- */
.cartao{
  background:var(--tinta-2);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:20px 18px 18px;margin-bottom:16px;
  animation:sobe .22s ease-out both;
}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cartao h1{
  font-family:var(--display);font-weight:700;font-size:clamp(20px,5.4vw,26px);
  line-height:1.18;margin:0 0 8px;letter-spacing:-.01em;
}
.meta{font-size:14px;color:var(--texto-fraco);line-height:1.5;margin:0}
.meta b{color:var(--texto);font-weight:600}
.codigo{
  font-family:var(--mono);font-size:13px;letter-spacing:.06em;
  color:var(--texto-fraco);margin-top:10px;
}

/* etiqueta de preço — o elemento-assinatura */
.etiqueta{
  margin:18px auto 4px;width:fit-content;
  background:var(--marca);color:#141326;
  border-radius:14px;padding:14px 26px 16px;
  transform:rotate(-1.8deg);
  box-shadow:0 10px 0 -4px rgba(0,0,0,.35),0 18px 32px rgba(0,0,0,.38);
  text-align:center;
}
.etiqueta .rotulo{
  font-family:var(--mono);font-weight:700;font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;opacity:.66;
}
.etiqueta .valor{
  font-family:var(--display);font-weight:800;
  font-size:clamp(46px,15vw,68px);line-height:.94;letter-spacing:-.03em;
  display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:4px;
}
.etiqueta .cifrao{font-size:.42em;font-weight:700;transform:translateY(-.22em)}
.etiqueta .centavos{font-size:.5em}

.feira{display:inline-flex;align-items:center;gap:8px;margin-top:12px;
  background:rgba(255,216,51,.13);border:1px solid rgba(255,216,51,.35);
  color:var(--marca);border-radius:999px;padding:7px 14px 7px 10px;font-size:13.5px}
.feira .qtd{font-family:var(--display);font-weight:800;font-size:16px;
  background:var(--marca);color:#141326;border-radius:999px;padding:1px 9px}
.feira.nao{background:none;border-color:rgba(255,255,255,.16);color:var(--texto-fraco)}
.tabela{text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--texto-fraco);margin-top:14px;letter-spacing:.02em}
.cartao.vazio{border-style:dashed;text-align:center;color:var(--texto-fraco);padding:30px 22px}
.cartao.erro{border-color:rgba(255,122,92,.5)}
.cartao.erro h1{color:var(--erro)}

/* ---------- listas ---------- */
.secao-rotulo{
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--texto-fraco);margin:22px 2px 10px;
}
.itens{list-style:none;margin:0;padding:0}
.itens li{border-bottom:1px solid rgba(255,255,255,.08)}
.itens button{
  width:100%;display:flex;gap:14px;align-items:center;justify-content:space-between;
  background:none;border:0;color:inherit;text-align:left;
  padding:13px 4px;font-size:15px;font-family:var(--corpo);cursor:pointer;
}
.itens button:active{background:rgba(255,255,255,.05)}
.itens .t{line-height:1.3}
.itens .t small{display:block;color:var(--texto-fraco);font-size:12.5px;margin-top:3px;font-family:var(--mono)}
.itens .p{
  font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap;color:var(--marca);
}
.aviso{font-size:14px;color:var(--texto-fraco);padding:6px 2px 0;line-height:1.5}

/* ---------- botão de leitura ---------- */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(18,20,58,0),var(--tinta) 38%);
}
.scan{
  width:100%;max-width:584px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;
  background:var(--marca);color:#141326;border:0;border-radius:16px;
  font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.01em;
  padding:18px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.scan:active{transform:translateY(1px)}
.scan svg{width:24px;height:24px}

/* ---------- câmera ---------- */
.camera{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mira{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mira .janela{
  width:min(84vw,420px);aspect-ratio:1.7/1;border-radius:16px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.55);position:relative;
}
.mira .janela::before,.mira .janela::after{
  content:'';position:absolute;left:-2px;right:-2px;height:26px;
  border:3px solid var(--marca);
}
.mira .janela::before{top:-2px;border-bottom:0;border-radius:16px 16px 0 0}
.mira .janela::after{bottom:-2px;border-top:0;border-radius:0 0 16px 16px}
.linha{
  position:absolute;left:8px;right:8px;height:3px;background:var(--marca);
  border-radius:3px;box-shadow:0 0 14px rgba(255,216,51,.9);
  animation:varre 2.1s ease-in-out infinite;
}
@keyframes varre{0%,100%{top:12%}50%{top:86%}}
.dica{
  position:absolute;left:0;right:0;text-align:center;font-size:14.5px;color:#fff;
  bottom:calc(120px + env(safe-area-inset-bottom));text-shadow:0 2px 8px rgba(0,0,0,.8);
  padding:0 24px;pointer-events:none;
}
.camera .controles{
  margin-top:auto;position:relative;z-index:2;display:flex;gap:12px;justify-content:center;
  padding:16px 18px calc(22px + env(safe-area-inset-bottom));
}
.camera .controles button{
  flex:1;max-width:220px;padding:16px;border-radius:14px;border:0;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:16px;
}
.btn-fechar{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px)}
.btn-lanterna{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px)}
.btn-lanterna[aria-pressed="true"]{background:var(--marca);color:#141326}
.falha{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:32px 26px;background:var(--tinta);gap:12px;z-index:3;
}
.falha h2{font-family:var(--display);font-size:21px;margin:0}
.falha p{color:var(--texto-fraco);font-size:15px;line-height:1.55;margin:0}

.rodape{
  max-width:620px;margin:26px auto 0;padding:16px 18px 24px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:12.5px;color:var(--texto-fraco);line-height:1.6;font-family:var(--mono);
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">LIVRARIA <em>BIG</em></div>
  <div class="sub">Consulta de preços</div>
</header>

<main>
  <div class="busca">
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off"

  <div id="resultado"></div>

  <div id="area-lista" hidden>
    <div class="secao-rotulo" id="rotulo-lista">Resultados</div>
    <ul class="itens" id="lista"></ul>
    <p class="aviso" id="aviso-lista" hidden></p>
  </div>

  <div id="area-recentes" hidden>
    <div class="secao-rotulo">Consultados agora há pouco</div>
    <ul class="itens" id="recentes"></ul>
  </div>

  <div class="rodape">
    <span id="total"></span><br>
    Listagem de venda 12/08/2026 · romaneio ARA LITERARIA 2026

</main>

<div class="barra">
  <button class="scan" id="btnScan">

      <path d="M7 8v8M10 8v8M13.5 8v8M17 8v8"/>

</div>

<div class="camera" id="camera" hidden>

  <div class="mira"><div class="janela"><div class="linha"></div></div></div>

  <div class="controles">
    <button class="btn-lanterna" id="btnZoom" hidden>Zoom 1x</button>
    <button class="btn-lanterna" id="btnLanterna" aria-pressed="false" hidden>Lanterna</button>
    <button class="btn-fechar" id="btnFechar">Fechar</button>
  </div>
  <div class="falha" id="falha" hidden>
    <h2 id="falha-titulo">A câmera não abriu</h2>
    <p id="falha-texto"></p>
    <button class="btn-fechar" id="btnFalhaFechar" style="margin-top:10px;padding:16px;border-radius:14px;border:0;font-family:var(--display);font-weight:700;font-size:16px;background:var(--marca);color:#141326">Digitar o código</button>
  </div>
</div>

<script>
(function(){
'use strict';

var LIVROS = JSON.parse(document.getElementById('dados').textContent);
// [ codigo, nome, autor, editora, tabela, arredondado, enviados ]
var C=0,N=1,A=2,E=3,T=4,P=5,Q=6;

var porCodigo = new Map();
var indice = new Array(LIVROS.length);
function semAcento(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();}
for(var i=0;i<LIVROS.length;i++){
  porCodigo.set(LIVROS[i][C], i);
  indice[i] = semAcento(LIVROS[i][N]+' '+LIVROS[i][A]+' '+LIVROS[i][E]);
}

var elQ=document.getElementById('q'), elLimpar=document.getElementById('limpar'),
    elResultado=document.getElementById('resultado'),
    elAreaLista=document.getElementById('area-lista'), elLista=document.getElementById('lista'),
    elRotuloLista=document.getElementById('rotulo-lista'), elAvisoLista=document.getElementById('aviso-lista'),
    elAreaRecentes=document.getElementById('area-recentes'), elRecentes=document.getElementById('recentes'),
    elCamera=document.getElementById('camera'), elVideo=document.getElementById('video'),
    elDica=document.getElementById('dica'), elFalha=document.getElementById('falha'),
    elFalhaTexto=document.getElementById('falha-texto'), elFalhaTitulo=document.getElementById('falha-titulo'),
    elLanterna=document.getElementById('btnLanterna'),
    elZoom=document.getElementById('btnZoom');

document.getElementById('total').textContent =
  LIVROS.length.toLocaleString('pt-BR') + ' títulos na listagem';

/* ---------- formatação ---------- */
function moeda(v){
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* ---------- busca por código ---------- */
function buscarCodigo(bruto){
  var d = String(bruto).replace(/\D/g,'');
  if(!d) return null;
  var tentativas=[d];
  if(d.length===12) tentativas.push('0'+d);
  if(d.length===13 && d.charAt(0)==='0') tentativas.push(d.slice(1));
  var semZeros = d.replace(/^0+/,'');
  if(semZeros && semZeros!==d) tentativas.push(semZeros);
  for(var k=0;k<tentativas.length;k++){
    if(porCodigo.has(tentativas[k])) return LIVROS[porCodigo.get(tentativas[k])];
  }
  return null;
}

/* ---------- busca por título ---------- */
function buscarTexto(termo){
  var alvo = semAcento(termo).trim();
  if(alvo.length<2) return [];
  var partes = alvo.split(/\s+/), achados=[];
  for(var i=0;i<indice.length && achados.length<400;i++){
    var txt=indice[i], ok=true;
    for(var j=0;j<partes.length;j++){ if(txt.indexOf(partes[j])===-1){ok=false;break;} }
    if(ok) achados.push(i);
  }
  achados.sort(function(a,b){
    var pa = semAcento(LIVROS[a][N]).indexOf(partes[0]),
        pb = semAcento(LIVROS[b][N]).indexOf(partes[0]);
    if(pa<0)pa=999; if(pb<0)pb=999;
    if(pa!==pb) return pa-pb;
    return LIVROS[a][N].localeCompare(LIVROS[b][N],'pt-BR');
  });
  return achados;
}

/* ---------- telas ---------- */
function mostrarLivro(livro){
  var preco = moeda(livro[P]).split(',');
  var linhas=[];
  if(livro[A]) linhas.push('<b>'+esc(livro[A])+'</b>');
  if(livro[E]) linhas.push(esc(livro[E]));
  var tabela = (livro[T]!==livro[P])
    ? '<div class="tabela">Preço de tabela R$ '+moeda(livro[T])+'</div>' : '';
  elResultado.innerHTML =
    '<div class="cartao">'+
      '<h1>'+esc(livro[N])+'</h1>'+
      (linhas.length?'<p class="meta">'+linhas.join(' · ')+'</p>':'')+
      '<div class="codigo">'+esc(livro[C])+'</div>'+
      (livro[Q]>0
        ? '<div class="feira"><span class="qtd">'+livro[Q]+'</span> '+(livro[Q]===1?'exemplar enviado':'exemplares enviados')+' à feira</div>'
        : '<div class="feira nao">Não enviado à feira</div>')+
      '<div class="etiqueta">'+
        '<div class="rotulo">Preço de venda</div>'+
        '<div class="valor"><span class="cifrao">R$</span>'+preco[0]+
          '<span class="centavos">,'+preco[1]+'</span></div>'+
      '</div>'+
      tabela+
    '</div>';
  registrarRecente(livro);
  window.scrollTo({top:0,behavior:'smooth'});
}

function mostrarNaoEncontrado(codigo){
  elResultado.innerHTML =
    '<div class="cartao erro">'+
      '<h1>Código fora da listagem</h1>'+
      '<p class="meta">Este código não consta na listagem de venda. Busque o título pelo nome ou confirme o preço no caixa.</p>'+
      '<div class="codigo">'+esc(codigo)+'</div>'+
    '</div>';
}

function mostrarInicio(){
  elResultado.innerHTML =
    '<div class="cartao vazio">'+
      '<p class="meta">Toque em <b>Ler código de barras</b> e aponte a câmera para o código na contracapa do livro.</p>'+
      '<p class="meta" style="margin-top:10px">Sem código legível? Digite o título no campo acima.</p>'+
    '</div>';
}

function renderLista(ids, rotulo, aviso){
  elRotuloLista.textContent = rotulo;
  elLista.innerHTML = ids.slice(0,40).map(function(i){
    var l=LIVROS[i];
    return '<li><button data-i="'+i+'">'+
      '<span class="t">'+esc(l[N])+'<small>'+esc(l[C])+(l[Q]>0?' · '+l[Q]+' na feira':' · não enviado')+'</small></span>'+
      '<span class="p">R$ '+moeda(l[P])+'</span></button></li>';
  }).join('');
  elAreaLista.hidden = false;
  if(aviso){ elAvisoLista.textContent=aviso; elAvisoLista.hidden=false; }
  else elAvisoLista.hidden=true;
}

elLista.addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-i]');
  if(!b) return;
  mostrarLivro(LIVROS[+b.dataset.i]);
});

/* ---------- recentes ---------- */
var recentes=[];
function registrarRecente(livro){
  recentes = recentes.filter(function(l){return l[C]!==livro[C];});
  recentes.unshift(livro);
  if(recentes.length>8) recentes.pop();
  if(recentes.length<2){ elAreaRecentes.hidden=true; return; }
  elRecentes.innerHTML = recentes.slice(1).map(function(l){
    return '<li><button data-c="'+esc(l[C])+'">'+
      '<span class="t">'+esc(l[N])+'</span>'+
      '<span class="p">R$ '+moeda(l[P])+'</span></button></li>';
  }).join('');
  elAreaRecentes.hidden=false;
}
elRecentes.addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-c]');
  if(!b) return;
  var l = buscarCodigo(b.dataset.c);
  if(l) mostrarLivro(l);
});

/* ---------- campo de busca ---------- */
var timer=null;
elQ.addEventListener('input', function(){
  elLimpar.hidden = !elQ.value;
  clearTimeout(timer);
  timer = setTimeout(rodarBusca, 130);
});
function rodarBusca(){
  var termo = elQ.value.trim();
  if(!termo){ elAreaLista.hidden=true; return; }
  var digitos = termo.replace(/\D/g,'');
  if(digitos.length>=7 && digitos.length===termo.replace(/\s/g,'').length){
    var l = buscarCodigo(digitos);
    if(l){ mostrarLivro(l); elAreaLista.hidden=true; return; }
    mostrarNaoEncontrado(digitos);
    elAreaLista.hidden=true;
    return;
  }
  var ids = buscarTexto(termo);
  if(!ids.length){
    renderLista([], 'Resultados', 'Nenhum título com “'+termo+'”. Tente uma palavra só, sem acento.');
    return;
  }
  renderLista(ids, ids.length+(ids.length===1?' título':' títulos'),
    ids.length>40 ? 'Mostrando os 40 primeiros. Digite mais uma palavra para afinar.' : '');
}
elLimpar.addEventListener('click', function(){
  elQ.value=''; elLimpar.hidden=true; elAreaLista.hidden=true; elQ.focus();
});

/* ---------- som e vibração ---------- */
var audioCtx=null;
function bip(ok){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type='square'; o.frequency.value = ok?1180:320;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+(ok?.12:.22));
    o.start(); o.stop(audioCtx.currentTime+(ok?.13:.23));
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(ok?45:[30,60,30]);
}

/* ---------- câmera ---------- */
var stream=null, detector=null, leitorZX=null, lendo=false, ultimo='', ultimoT=0;
var quadro=document.createElement('canvas'), qctx=null, passo=0, tDica=null, faixaZoom=null;
try{ qctx = quadro.getContext('2d', {willReadFrequently:true}); }catch(e){ qctx = quadro.getContext('2d'); }

/* recortes testados em rodízio: [largura, altura] como fração do quadro */
var RECORTES = [[0.92,0.34],[0.66,0.24],[1,0.55],[1,1]];

document.getElementById('btnScan').addEventListener('click', abrirCamera);
document.getElementById('btnFechar').addEventListener('click', fecharCamera);
document.getElementById('btnFalhaFechar').addEventListener('click', function(){
  fecharCamera(); elQ.focus();
});

function carregarScript(urls){
  return new Promise(function(resolve,reject){
    var n=0;
    (function tenta(){
      if(n>=urls.length) return reject(new Error('sem-biblioteca'));
      var s=document.createElement('script');
      s.src=urls[n++];
      s.onload=resolve;
      s.onerror=function(){ s.remove(); tenta(); };
      document.head.appendChild(s);
    })();
  });
}

async function abrirCamera(){
  elCamera.hidden=false; elFalha.hidden=true;
  elDica.textContent='Encaixe o código de barras na janela';
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return falharCamera('A câmera não abriu',
      'Este navegador não libera a câmera. Abra a página pelo Safari ou Chrome, em endereço https. Enquanto isso, digite o código no campo de busca.');
  }
  try{ await abrirFluxo(); }
  catch(err){ return tratarErroCamera(err); }

  clearTimeout(tDica);
  tDica = setTimeout(function(){
    if(lendo) elDica.textContent='Aproxime até o código ocupar a largura da janela';
  }, 6000);

  try{
    if(window.BarcodeDetector){
      var suportados = await window.BarcodeDetector.getSupportedFormats();
      var querem = ['ean_13','ean_8','upc_a','upc_e','code_128','itf'].filter(function(f){
        return suportados.indexOf(f)>=0;
      });
      if(querem.length){
        detector = new window.BarcodeDetector({formats:querem});
        lendo=true; laco();
        return;
      }
    }
    elDica.textContent='Preparando o leitor…';
    await prepararZXing();
    elDica.textContent='Encaixe o código de barras na janela';
    lendo=true; laco();
  }catch(err){
    tratarErroCamera(err);
  }
}

async function abrirFluxo(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
    audio:false
  });
  elVideo.srcObject=stream;
  try{ await elVideo.play(); }catch(e){}
  var espera=0;
  while(!elVideo.videoWidth && espera<3000){
    await new Promise(function(r){ setTimeout(r,100); });
    espera+=100;
  }
  prepararLanterna();
  prepararZoom();
}

async function prepararZXing(){
  await carregarScript([
    'https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.21.3/index.min.js',
    'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js'
  ]);
  var Z = window.ZXing;
  var hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
    Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8,
    Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E,
    Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.ITF
  ]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  leitorZX = new Z.MultiFormatReader();
  leitorZX.setHints(hints);
}

/* desenha um recorte do vídeo no canvas e devolve o contexto de imagem */
function recortar(){
  var vw = elVideo.videoWidth, vh = elVideo.videoHeight;
  if(!vw || !vh) return null;
  var r = RECORTES[passo % RECORTES.length]; passo++;
  var cw = Math.round(vw*r[0]), ch = Math.round(vh*r[1]);
  var sx = Math.round((vw-cw)/2), sy = Math.round((vh-ch)/2);
  var largura = Math.min(cw, 960);
  var altura = Math.max(1, Math.round(ch*largura/cw));
  quadro.width=largura; quadro.height=altura;
  qctx.drawImage(elVideo, sx, sy, cw, ch, 0, 0, largura, altura);
  return {w:largura, h:altura};
}

function laco(){
  if(!lendo) return;
  try{ tentarQuadro(); }catch(e){}
  setTimeout(laco, 110);
}

function tentarQuadro(){
  if(detector){
    detector.detect(elVideo).then(function(codigos){
      if(codigos && codigos.length) receberCodigo(codigos[0].rawValue);
    }).catch(function(){});
    return;
  }
  if(!leitorZX) return;
  var dim = recortar();
  if(!dim) return;
  var d = qctx.getImageData(0,0,dim.w,dim.h).data;
  var lum = new Uint8ClampedArray(dim.w*dim.h);
  for(var i=0,j=0;i<d.length;i+=4,j++){
    lum[j] = (d[i]*306 + d[i+1]*601 + d[i+2]*117) >> 10;
  }
  var Z = window.ZXing;
  var fonte = new Z.RGBLuminanceSource(lum, dim.w, dim.h);
  var mapa = new Z.BinaryBitmap(new Z.HybridBinarizer(fonte));
  var achou = null;
  try{ achou = leitorZX.decode(mapa); }catch(e){}
  try{ leitorZX.reset(); }catch(e){}
  if(achou) receberCodigo(achou.getText());
}

function prepararZoom(){
  faixaZoom=null;
  try{
    var track = stream && stream.getVideoTracks()[0];
    if(!track || !track.getCapabilities) return;
    var caps = track.getCapabilities();
    if(!caps || !caps.zoom || !(caps.zoom.max > caps.zoom.min)) return;
    faixaZoom = caps.zoom;
    elZoom.hidden=false;
    elZoom.textContent='Zoom 1x';
    elZoom.onclick=function(){
      var atual = track.getSettings().zoom || faixaZoom.min;
      var proximo = atual >= faixaZoom.min*2 ? faixaZoom.min
                  : Math.min(faixaZoom.max, faixaZoom.min*2 || 2);
      track.applyConstraints({advanced:[{zoom:proximo}]}).then(function(){
        elZoom.textContent = 'Zoom ' + (proximo>=faixaZoom.min*2 ? '2x' : '1x');
      }).catch(function(){ elZoom.hidden=true; });
    };
  }catch(e){}
}

function receberCodigo(texto){
  var agora = Date.now();
  if(texto===ultimo && agora-ultimoT<1500) return;
  ultimo=texto; ultimoT=agora;
  var livro = buscarCodigo(texto);
  bip(!!livro);
  fecharCamera();
  if(livro) mostrarLivro(livro);
  else mostrarNaoEncontrado(String(texto).replace(/\D/g,'') || texto);
  elAreaLista.hidden=true;
  elQ.value=''; elLimpar.hidden=true;
}

function prepararLanterna(){
  try{
    var track = stream && stream.getVideoTracks()[0];
    if(!track || !track.getCapabilities) return;
    var caps = track.getCapabilities();
    if(!caps || !caps.torch) return;
    elLanterna.hidden=false;
    elLanterna.onclick=function(){
      var ligar = elLanterna.getAttribute('aria-pressed')!=='true';
      track.applyConstraints({advanced:[{torch:ligar}]}).then(function(){
        elLanterna.setAttribute('aria-pressed', ligar?'true':'false');
      }).catch(function(){ elLanterna.hidden=true; });
    };
  }catch(e){}
}

function tratarErroCamera(err){
  var nome = err && err.name || '';
  if(nome==='NotAllowedError' || nome==='SecurityError'){
    falharCamera('Permissão de câmera negada',
      'Toque no cadeado ao lado do endereço, libere a câmera e tente de novo. Em iPhone: Ajustes › Safari › Câmera › Perguntar.');
  }else if(nome==='NotFoundError' || nome==='OverconstrainedError'){
    falharCamera('Nenhuma câmera encontrada',
      'O aparelho não expôs uma câmera traseira para o navegador. Digite o código no campo de busca.');
  }else if(err && err.message==='sem-biblioteca'){
    falharCamera('Leitor não carregou',
      'Sem internet para carregar o leitor de código neste aparelho. Digite o código no campo de busca — a lista de preços já está salva na página.');
  }else{
    falharCamera('A câmera não abriu',
      'Confira se a página está em endereço https e se nenhum outro app está usando a câmera. Digite o código no campo de busca enquanto isso.');
  }
}

function falharCamera(titulo,texto){
  elFalhaTitulo.textContent=titulo;
  elFalhaTexto.textContent=texto;
  elFalha.hidden=false;
}

function fecharCamera(){
  lendo=false;
  clearTimeout(tDica);
  detector=null;
  try{ if(leitorZX) leitorZX.reset(); }catch(e){}
  try{
    var s = stream || elVideo.srcObject;
    if(s) s.getTracks().forEach(function(t){ t.stop(); });
  }catch(e){}
  stream=null; elVideo.srcObject=null;
  elLanterna.hidden=true; elLanterna.setAttribute('aria-pressed','false');
  elZoom.hidden=true;
  elCamera.hidden=true;
}

window.addEventListener('pagehide', fecharCamera);
document.addEventListener('visibilitychange', function(){
  if(document.hidden && !elCamera.hidden) fecharCamera();
});

mostrarInicio();
})();
</script>
